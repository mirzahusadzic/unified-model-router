name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Check JavaScript syntax
        run: |
          for file in install.mjs router/*.mjs scripts/*.mjs tests/*.mjs tests/integration/*.mjs; do
            node --check "$file"
          done
      - name: Run regression tests
        run: |
          flags=(--experimental-test-coverage)
          flags+=(--test-coverage-include='router/**/*.mjs')
          flags+=(--test-coverage-include='scripts/**/*.mjs')
          flags+=(--test-coverage-include='install.mjs')
          if [ "${{ matrix.node }}" = "20" ]; then
            node --test
          elif [ "${{ matrix.node }}" != "20" ] && [ "${{ matrix.os }}" != "windows-latest" ]; then
            mkdir -p coverage
            node --test "${flags[@]}" --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=lcov --test-reporter-destination=coverage/lcov.info
            if [ "${{ matrix.node }}" = "24" ] && [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
              for file in install.mjs router/*.mjs scripts/*.mjs; do
                if ! grep -Fqx "SF:$file" coverage/lcov.info; then
                  printf 'Coverage report omits production file: %s\n' "$file" >&2
                  exit 1
                fi
              done
            fi
          else
            node --test "${flags[@]}"
          fi
      - name: Validate catalog JSON
        run: |
          for file in catalog/*/*.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done
      - name: Check Bash syntax
        if: runner.os != 'Windows'
        run: |
          for file in platform/unix/*.sh; do
            bash -n "$file"
          done
      - name: Check Windows PowerShell 5.1 syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $files = @(Get-ChildItem platform -Recurse -Filter '*.ps1' | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw ($parseErrors | Out-String)
            }
          }
      - name: Test Windows credential permissions
        if: runner.os == 'Windows'
        shell: powershell
        run: .\platform\windows\private-path.test.ps1
